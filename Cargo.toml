[package]
name = "apollo-mission-simulator"
version = "0.1.0"
edition = "2021"
authors = ["ApolloSim Team"]
description = "3D Apollo Mission Simulator based on original NASA documentation"

[dependencies]
bevy = { version = "0.14", default-features = false, features = [
    "animation", "bevy_asset", "bevy_state", "bevy_color", 
    "bevy_scene", "bevy_winit", "bevy_core_pipeline", "bevy_pbr", "bevy_gltf",
    "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "multi_threaded",
    "png", "hdr", "x11", "bevy_gizmos", 
    "tonemapping_luts", "smaa_luts", "default_font", "webgl2", "sysinfo_plugin",
    "jpeg", "dynamic_linking",
] }
bevy_egui = "0.29"
nalgebra = "0.33"
chrono = "0.4"
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
rand = "0.8"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false, optional = true }
tokio = { version = "1", features = ["rt", "sync"], optional = true }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[features]
llm-npcs = ["dep:reqwest", "dep:tokio", "dep:serde", "dep:serde_json"]

[build-dependencies]
cc = "1.0"

[[bin]]
name = "apollo-sim"
path = "src/main.rs"
